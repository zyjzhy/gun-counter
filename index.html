<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>揍你丫的</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  min-height: 100%;
  background: #0a0a14;
}

body {
  height: 100vh;
  height: 100svh;
  height: var(--app-height, 100dvh);
  width: 100%;
  padding:
    max(14px, env(safe-area-inset-top, 0px))
    max(12px, env(safe-area-inset-right, 0px))
    max(14px, env(safe-area-inset-bottom, 0px))
    max(12px, env(safe-area-inset-left, 0px));
  background: radial-gradient(ellipse at 50% 20%, #1e1a3a, #0a0a14 70%);
  color: #e0e0e0;
  font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  user-select: none;
  overflow: hidden;
  touch-action: manipulation;
}

canvas#particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

.container {
  text-align: center;
  padding: clamp(18px, 3.2vh, 32px) clamp(16px, 5vw, 30px) clamp(14px, 2.5vh, 24px);
  position: relative;
  z-index: 1;
  background: rgba(255,255,255,.04);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: 36px;
  border: 1px solid rgba(255,255,255,.08);
  box-shadow:
    0 40px 100px rgba(0,0,0,.5),
    0 0 0 1px rgba(255,255,255,.04) inset,
    0 0 100px rgba(180,60,200,.05);
  transform: rotateX(1deg);
  transition: transform .8s cubic-bezier(.23,1,.32,1);
  width: min(440px, calc(100vw - 28px));
  max-width: 440px;
  max-height: 100%;
  margin: auto;
}
.container:hover { transform: rotateX(0); }

.title-bg {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(200px, 50vw, 500px);
  font-weight: 900;
  color: rgba(255,255,255,.012);
  pointer-events: none;
  letter-spacing: 30px;
  z-index: 0;
  line-height: 1;
}

.top-bar {
  height: 20px;
  margin-bottom: clamp(8px, 1.5vh, 14px);
  position: relative;
  z-index: 1;
  font-size: 12.5px;
  color: rgba(255,255,255,.5);
  letter-spacing: 3px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  text-align: center;
  font-weight: 300;
}

.settings-btn {
  position: absolute;
  top: 12px;
  right: 14px;
  z-index: 10;
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: rgba(255,255,255,.3);
  transition: color .2s, transform .2s;
  padding: 4px;
  line-height: 1;
  -webkit-tap-highlight-color: transparent;
}
.settings-btn:hover { color: rgba(255,255,255,.6); transform: rotate(30deg); }

.settings-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  justify-content: center;
  align-items: center;
}
.settings-overlay.open { display: flex; }

.settings-panel {
  background: rgba(30,26,58,.95);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 20px;
  padding: 28px 24px 24px;
  width: min(340px, calc(100vw - 40px));
  box-shadow: 0 30px 80px rgba(0,0,0,.6);
}
.settings-panel h2 {
  font-size: 16px;
  font-weight: 600;
  color: rgba(255,255,255,.6);
  letter-spacing: 4px;
  margin-bottom: 20px;
  text-align: center;
}
.settings-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 18px;
}
.settings-row label {
  font-size: 12px;
  color: rgba(255,255,255,.4);
  letter-spacing: 1px;
}
.settings-row input {
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px;
  padding: 12px 14px;
  color: #fff;
  font-size: 15px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  font-family: inherit;
  letter-spacing: 2px;
}
.settings-row input:focus {
  border-color: rgba(255,200,100,.4);
  box-shadow: 0 0 0 3px rgba(255,200,100,.08);
}
.settings-row input::placeholder { color: rgba(255,255,255,.2); letter-spacing: 1px; }

.settings-actions {
  display: flex;
  gap: 10px;
  margin-top: 4px;
}
.settings-btn-act {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: background .2s, transform .15s;
  -webkit-tap-highlight-color: transparent;
}
.settings-btn-act:active { transform: scale(.96); }

/* 自定义确认弹窗 */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: rgba(0,0,0,.5);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  justify-content: center;
  align-items: center;
}
.modal-overlay.open { display: flex; }

.modal-box {
  background: rgba(30,26,58,.96);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 18px;
  padding: 24px 22px 18px;
  width: min(290px, calc(100vw - 50px));
  box-shadow: 0 30px 80px rgba(0,0,0,.6);
  text-align: center;
}
.modal-box p {
  font-size: 14px;
  color: rgba(255,255,255,.6);
  letter-spacing: 2px;
  margin-bottom: 20px;
  line-height: 1.6;
}
.modal-actions {
  display: flex;
  gap: 10px;
}
.modal-actions button {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: background .2s, transform .15s;
  -webkit-tap-highlight-color: transparent;
}
.modal-actions button:active { transform: scale(.96); }
.modal-btn-cancel {
  background: rgba(255,255,255,.06);
  color: rgba(255,255,255,.5);
  border: 1px solid rgba(255,255,255,.06);
}
.modal-btn-cancel:hover { background: rgba(255,255,255,.1); }
.modal-btn-confirm {
  background: rgba(255,71,87,.15);
  color: rgba(255,100,110,.7);
  border: 1px solid rgba(255,71,87,.15);
}
.modal-btn-confirm:hover { background: rgba(255,71,87,.25); }

.settings-btn-reset {
  background: rgba(255,71,87,.15);
  color: rgba(255,100,110,.7);
  border: 1px solid rgba(255,71,87,.15);
}
.settings-btn-reset:hover { background: rgba(255,71,87,.25); }
.settings-btn-close {
  background: rgba(255,255,255,.06);
  color: rgba(255,255,255,.5);
  border: 1px solid rgba(255,255,255,.06);
}
.settings-btn-close:hover { background: rgba(255,255,255,.1); }
.settings-btn-cancel {
  background: rgba(255,255,255,.04);
  color: rgba(255,255,255,.35);
  border: 1px solid rgba(255,255,255,.04);
}
.settings-btn-cancel:hover { background: rgba(255,255,255,.08); color: rgba(255,255,255,.5); }

.settings-divider {
  height: 1px;
  background: rgba(255,255,255,.06);
  margin: 2px 0 14px;
}

.count-wrap {
  position: relative;
  z-index: 1;
  margin: 0 auto 8px;
  width: 100%;
  overflow: hidden;
}
.count {
  font-size: clamp(100px, 22vw, 200px);
  font-weight: 900;
  line-height: 1;
  position: relative;
  font-variant-numeric: tabular-nums;
  text-align: center;
  display: block;
  width: 100%;
  background: linear-gradient(180deg, #ffffff 0%, #ffb3c1 45%, #ff6b8a 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 4px 12px rgba(255,65,108,.15));
  transition: transform .15s ease;
}
.count.pop {
  animation: popBounce .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popBounce {
  0% { transform: scale(1); filter: drop-shadow(0 4px 12px rgba(255,65,108,.15)); }
  35% { transform: scale(1.2); filter: drop-shadow(0 8px 30px rgba(255,65,108,.35)); }
  70% { transform: scale(.95); }
  100% { transform: scale(1); filter: drop-shadow(0 4px 12px rgba(255,65,108,.15)); }
}

.label {
  font-size: 13px;
  color: rgba(255,255,255,.5);
  letter-spacing: 4px;
  font-weight: 300;
  margin-bottom: clamp(12px, 2.5vh, 24px);
  position: relative;
  z-index: 1;
}
.label span {
  display: inline-block;
  animation: labelDrift 5s ease-in-out infinite;
}
.label span:nth-child(2) { animation-delay: .3s; }
.label span:nth-child(3) { animation-delay: .6s; }
.label span:nth-child(4) { animation-delay: .9s; }
.label span:nth-child(5) { animation-delay: 1.2s; }
.label span:nth-child(6) { animation-delay: 1.5s; }
@keyframes labelDrift {
  0%, 100% { transform: translateY(0); opacity: .3; }
  50% { transform: translateY(-3px); opacity: .7; }
}

.btn-wrap {
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 300px;
  height: 230px;
  margin: -14px auto -6px;
}

.btn-main {
  width: 154px;
  height: 154px;
  border-radius: 50%;
  border: none;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 6px;
  cursor: pointer;
  position: relative;
  display: inline-grid;
  place-items: center;
  padding: 0;
  background: transparent;
  box-shadow: none;
  transition: all .3s cubic-bezier(.34,1.56,.64,1);
  color: transparent;
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  filter:
    drop-shadow(0 20px 22px rgba(0,0,0,.35))
    drop-shadow(0 0 34px rgba(255,65,108,.22));
  will-change: transform;
  z-index: 3;
  --punch-x: 60px;
  --punch-y: 0px;
}
.btn-main::before {
  content: '👊';
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  pointer-events: none;
  display: grid;
  place-items: center;
  line-height: 1;
  text-indent: 0;
  color: initial;
  text-shadow: none;
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  font-size: 118px;
  transform: translateY(3px) rotate(-8deg);
}
.btn-main::after {
  content: '';
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: 8px;
  height: 22px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(255,65,108,.38), transparent 72%);
  filter: blur(8px);
  opacity: .75;
  pointer-events: none;
}
.btn-main:hover {
  transform: scale(1.07);
  filter:
    drop-shadow(0 24px 26px rgba(0,0,0,.38))
    drop-shadow(0 0 44px rgba(255,65,108,.3));
}
.btn-main:active {
  transform: scale(.9);
  filter:
    drop-shadow(0 10px 12px rgba(0,0,0,.35))
    drop-shadow(0 0 24px rgba(255,65,108,.2));
}

.glow-ring {
  position: absolute;
  top: 50%; left: 50%;
  width: 160px; height: 160px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1px solid rgba(255,65,108,.07);
  animation: ringPulse 4s ease-in-out infinite;
  pointer-events: none;
}
.glow-ring:nth-child(2) { width: 200px; height: 200px; animation-delay: 1s; }
.glow-ring:nth-child(3) { width: 240px; height: 240px; animation-delay: 2s; }
@keyframes ringPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: .3; }
  50% { transform: translate(-50%, -50%) scale(1.12); opacity: .04; }
}

/* 出拳动画 - 四个方向 */
.btn-main.punch-right,
.btn-main.punch-left,
.btn-main.punch-up,
.btn-main.punch-down {
  animation: buttonPunchStrike .36s cubic-bezier(.34,1.56,.64,1);
}
@keyframes buttonPunchStrike {
  0% { transform: translateX(0) scale(1); }
  34% { transform: translate(var(--punch-x), var(--punch-y)) scale(1.16) rotate(var(--punch-rotate, 8deg)); }
  55% { transform: translate(var(--punch-x), var(--punch-y)) scale(.95) rotate(calc(var(--punch-rotate, 8deg) * .45)); }
  82% { transform: translate(calc(var(--punch-x) * .32), calc(var(--punch-y) * .32)) scale(1.04); }
  100% { transform: translateX(0) scale(1); }
}

/* 直击正面 - 重拳砸脸 */
.btn-main.punch-center {
  animation: buttonDirectHit .42s cubic-bezier(.2,1.1,.3,1);
}
@keyframes buttonDirectHit {
  0% { transform: scale(1); }
  30% { transform: scale(1.35) translateY(12px); }
  50% { transform: scale(.92) translateY(4px); }
  75% { transform: scale(1.06) translateY(-2px); }
  100% { transform: scale(1); }
}

.screen-shake {
  animation: screenShake .32s ease-out;
}
@keyframes screenShake {
  0% { transform: translate(0,0); }
  15% { transform: translate(-4px,3px); }
  30% { transform: translate(5px,-2px); }
  45% { transform: translate(-3px,-4px); }
  60% { transform: translate(2px,2px); }
  80% { transform: translate(-1px,0); }
  100% { transform: translate(0,0); }
}

.target-photo {
  --tx: 118px;
  --ty: 0px;
  --hit-x: 16px;
  --hit-y: 0px;
  position: absolute;
  top: 50%;
  left: 50%;
  width: 86px;
  aspect-ratio: 1;
  z-index: 5;
  border-radius: 16px;
  padding: 4px;
  background: linear-gradient(145deg, rgba(255,255,255,.78), rgba(255,255,255,.16));
  box-shadow:
    0 16px 30px rgba(0,0,0,.32),
    0 0 0 1px rgba(255,255,255,.26) inset,
    0 0 34px rgba(100,255,180,.12);
  transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) rotate(var(--target-rotate, 0deg)) scale(1);
  opacity: .96;
  pointer-events: none;
  transition:
    transform .44s cubic-bezier(.23,1,.32,1),
    opacity .22s ease,
    box-shadow .22s ease;
  will-change: transform;
}
.target-photo img {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 12px;
  object-fit: cover;
  background: rgba(255,255,255,.1);
}
.target-photo.hit {
  animation: photoImpact .55s cubic-bezier(.2,1.1,.3,1) both;
  box-shadow:
    0 22px 38px rgba(0,0,0,.42),
    0 0 0 2px rgba(255,255,255,.4) inset,
    0 0 42px rgba(255,70,90,.42);
}
.target-photo.hit-center {
  animation: photoImpactCenter .6s cubic-bezier(.15,1.2,.3,1) both;
  box-shadow:
    0 26px 44px rgba(0,0,0,.5),
    0 0 0 3px rgba(255,255,120,.5) inset,
    0 0 60px rgba(255,70,90,.6),
    0 0 120px rgba(255,200,50,.15);
}
@keyframes photoImpactCenter {
  0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); filter: saturate(1); }
  15% { transform: translate(-50%, -50%) scale(.7, 1.3) rotate(-4deg); filter: saturate(1.8) contrast(1.25); }
  35% { transform: translate(-50%, -50%) scale(1.12, .88) rotate(3deg); }
  55% { transform: translate(-50%, -50%) scale(.92, 1.04) rotate(-2deg); }
  75% { transform: translate(-50%, -50%) scale(1.02, .98) rotate(1deg); }
  100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); filter: saturate(1); }
}
.target-photo.hit::after {
  content: '';
  position: absolute;
  inset: -16px;
  border-radius: 50%;
  border: 2px solid rgba(255,245,120,.8);
  animation: impactRing .5s ease-out forwards;
}
@keyframes photoImpact {
  0% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) rotate(var(--target-rotate, 0deg)) scale(1); filter: saturate(1); }
  22% { transform: translate(calc(-50% + var(--tx) + var(--hit-x)), calc(-50% + var(--ty) + var(--hit-y))) rotate(calc(var(--target-rotate, 0deg) + var(--impact-rotate, 16deg))) scale(.82, 1.18) translateZ(0); filter: saturate(1.5) contrast(1.15); }
  44% { transform: translate(calc(-50% + var(--tx) - var(--hit-x) * .3), calc(-50% + var(--ty) - var(--hit-y) * .3)) rotate(calc(var(--target-rotate, 0deg) - var(--impact-rotate, 16deg) * .5)) scale(1.12, .9); }
  66% { transform: translate(calc(-50% + var(--tx) + var(--hit-x) * .12), calc(-50% + var(--ty) + var(--hit-y) * .12)) rotate(calc(var(--target-rotate, 0deg) + var(--impact-rotate, 16deg) * .2)) scale(.96, 1.04); }
  100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) rotate(var(--target-rotate, 0deg)) scale(1); filter: saturate(1); }
}
@keyframes impactRing {
  0% { transform: scale(.2); opacity: .95; }
  100% { transform: scale(1.6); opacity: 0; }
}

/* 张永建挨揍脸 */
.face-hit {
  position: fixed;
  pointer-events: none;
  z-index: 1000;
  font-size: 80px;
  animation: faceHitAnim 1.2s ease-out forwards;
}
@keyframes faceHitAnim {
  0% { transform: scale(.1) translate(0,0) rotate(0); opacity: 0; }
  15% { transform: scale(1.3) translate(calc(var(--fx)*.15),calc(var(--fy)*.15)) rotate(-5deg); opacity: 1; }
  40% { transform: scale(.9) translate(calc(var(--fx)*.4),calc(var(--fy)*.4)) rotate(5deg); opacity: .9; }
  70% { transform: scale(1.1) translate(calc(var(--fx)*.7),calc(var(--fy)*.7)) rotate(-8deg); opacity: .6; }
  100% { transform: scale(.2) translate(calc(var(--fx)),calc(var(--fy))) rotate(20deg); opacity: 0; }
}

/* 额外飞出的表情 */
.face-fly {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  font-size: 36px;
  animation: faceFlyAnim .9s ease-out forwards;
}
@keyframes faceFlyAnim {
  0% { transform: translate(0,0) scale(.2) rotate(0); opacity: 0; }
  20% { transform: translate(20px,-30px) scale(1.2) rotate(40deg); opacity: 1; }
  100% { transform: translate(80px,-120px) scale(.3) rotate(180deg); opacity: 0; }
}

/* 星星/冲击波 */
.hit-star {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  font-size: 28px;
  text-shadow:
    0 0 6px currentColor,
    0 0 15px currentColor,
    0 0 30px currentColor;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.4));
  animation: hitStarAnim 1.1s ease-out forwards;
}
@keyframes hitStarAnim {
  0% { transform: translate(0,0) scale(0) rotate(0); opacity: 1; }
  50% { transform: translate(var(--dx),var(--dy)) scale(1.3) rotate(180deg); opacity: 1; }
  100% { transform: translate(var(--dx2),var(--dy2)) scale(.2) rotate(360deg); opacity: 0; }
}

/* 拳风文字飞出 - 多种轨迹 */
.punch-word {
  position: fixed;
  pointer-events: none;
  z-index: 1000;
  font-size: clamp(22px, 4vw, 34px);
  font-weight: 900;
  white-space: nowrap;
  text-shadow:
    0 0 10px currentColor,
    0 0 30px currentColor,
    0 0 60px currentColor,
    0 0 8px rgba(0,0,0,.6);
  -webkit-text-stroke: .5px rgba(0,0,0,.3);
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.5));
}
.punch-word.straight {
  animation: punchStraight 1.2s ease-out forwards;
}
.punch-word.up {
  animation: punchUp 1.4s ease-out forwards;
}
.punch-word.spin {
  animation: punchSpin 1.3s ease-out forwards;
  animation-delay: .4s;
}
.punch-word.bounce {
  animation: punchBounce 1.5s ease-out forwards;
}
.punch-word.zigzag {
  animation: punchZigzag 1.4s ease-out forwards;
}
.punch-word.shatter {
  animation: punchShatter 1.2s ease-out forwards;
}
.punch-word.swoop {
  animation: punchSwoop 1.3s ease-out forwards;
}
.punch-word.wobble {
  animation: punchWobble 1.4s ease-out forwards;
}
.punch-word.spiral {
  animation: punchSpiral 1.5s ease-out forwards;
  animation-delay: .4s;
}
@keyframes punchStraight {
  0% { transform: translate(0,0) scale(.2) rotate(0); opacity: 0; }
  20% { transform: translate(var(--wx),var(--wy)) scale(1.1) rotate(5deg); opacity: 1; }
  100% { transform: translate(var(--wx2),var(--wy2)) scale(.3) rotate(30deg); opacity: 0; }
}
@keyframes punchUp {
  0% { transform: translate(0,0) scale(.3); opacity: 0; }
  20% { transform: translate(-10px,-30px) scale(1.2); opacity: 1; }
  60% { transform: translate(10px,-90px) scale(1); opacity: .8; }
  100% { transform: translate(-5px,-130px) scale(.2); opacity: 0; }
}
@keyframes punchSpin {
  0% { transform: translate(0,0) scale(.2) rotate(0); opacity: 0; }
  30% { transform: translate(var(--wx),var(--wy)) scale(1.3) rotate(180deg); opacity: 1; }
  100% { transform: translate(var(--wx2),var(--wy2)) scale(.2) rotate(720deg); opacity: 0; }
}
@keyframes punchBounce {
  0% { transform: translate(0,0) scale(.2) rotate(-20deg); opacity: 0; }
  25% { transform: translate(10px,-40px) scale(1.2) rotate(10deg); opacity: 1; }

  const PHOTO_KEY = 'gun_counter_target_photo';

  function generateNamePhoto(name) {
    const chars = name.split('');
    const len = chars.length;
    let fontSize, gap, col2 = false, mid = len;
    if (len <= 2) { fontSize = 36; gap = 42; }
    else if (len === 3) { fontSize = 28; gap = 34; }
    else if (len === 4) { fontSize = 24; gap = 28; }
    else { fontSize = 22; gap = 30; col2 = true; mid = Math.ceil(len / 2); }

    const cols = col2 ? 2 : 1;
    const rowsPerCol = col2 ? mid : len;
    const totalH = (rowsPerCol - 1) * gap + fontSize;
    const startY = Math.round((120 - totalH) / 2 + fontSize * .75);

    const texts = chars.map((c, i) => {
      const col = col2 && i >= mid ? 1 : 0;
      const idx = col2 && i >= mid ? i - mid : i;
      const cx = Math.round(120 / (cols + 1) * (col + 1));
      const cy = startY + idx * gap;
      return `<text x="${cx}" y="${cy}" text-anchor="middle" font-size="${fontSize}" fill="#fff" font-weight="900" font-family="sans-serif">${c}</text>`;
    }).join('');

    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="#ffd166"/>
          <stop offset="1" stop-color="#ef476f"/>
        </linearGradient>
      </defs>
      <rect width="120" height="120" rx="24" fill="url(#bg)"/>
      ${texts}
    </svg>`;
    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
  }

  function placeTarget(nextDir) {
    if (nextDir) targetDir = nextDir;

    const wrap = document.querySelector('.btn-wrap').getBoundingClientRect();
    const size = targetPhoto.getBoundingClientRect().width || 72;
    const maxX = Math.max(58, wrap.width / 2 - size / 2 - 8);
    const maxY = Math.max(54, wrap.height / 2 - size / 2 - 8);
    const jitterX = (Math.random() - .5) * 14;
    const jitterY = (Math.random() - .5) * 12;
    const positions = {
      right: [maxX, jitterY, 8],
      left: [-maxX, jitterY, -8],
      up: [jitterX, -maxY, -6],
      down: [jitterX, maxY, 6],
      center: [0, 0, 0],
    };
    const [tx, ty, rotate] = positions[targetDir] || positions.right;
    const isCenter = targetDir === 'center';
    const punchX = isCenter ? 0 : Math.round(tx * .5);
    const punchY = isCenter ? 40 : Math.round(ty * .5);
    const impactRotate = isCenter ? 0 : (tx < 0 || ty < 0 ? -12 : 12);

    targetPhoto.style.setProperty('--tx', Math.round(tx) + 'px');
    targetPhoto.style.setProperty('--ty', Math.round(ty) + 'px');
    targetPhoto.style.setProperty('--target-rotate', rotate + 'deg');
    targetPhoto.style.setProperty('--hit-x', isCenter ? '0px' : Math.round(tx * .16) + 'px');
    targetPhoto.style.setProperty('--hit-y', isCenter ? '8px' : Math.round(ty * .16) + 'px');
    targetPhoto.style.setProperty('--impact-rotate', impactRotate + 'deg');

    addBtn.style.setProperty('--punch-x', punchX + 'px');
    addBtn.style.setProperty('--punch-y', punchY + 'px');
    addBtn.style.setProperty('--punch-rotate', (isCenter ? 0 : (tx < 0 || ty < 0 ? -10 : 10)) + 'deg');
  }

  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.size = Math.random() * 2 + .3;
      this.speedX = (Math.random() - .5) * .25;
      this.speedY = (Math.random() - .5) * .25;
      this.opacity = Math.random() * .4 + .06;
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
      if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
      ctx.fill();
    }
  }
  for (let i = 0; i < 60; i++) particles.push(new Particle());

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) { p.update(); p.draw(); }
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 100) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(180,80,200,${.04 * (1 - dist / 100)})`;
          ctx.lineWidth = .4;
          ctx.stroke();
        }
      }
    }
    raf = requestAnimationFrame(animateParticles);
  }
  animateParticles();

  }

  // ---- 每日随机自增（伪造实时更新） ----
  const AUTO_KEY = 'gun_auto_increment';

  function applyDailyAutoIncrement() {
    const today = todayStr();
    let autoData;
    try {
      autoData = JSON.parse(localStorage.getItem(AUTO_KEY));
    } catch (e) { autoData = null; }

    if (autoData && autoData.date === today) {
      return 0;
    }

    const day = new Date().getDay();
    const isWeekend = day === 0 || day === 6;
    const hour = new Date().getHours();
    const isNight = hour < 6 || hour > 22;

    let base = Math.floor(Math.random() * 25) + 8;
    let bonus = 0;

    if (isWeekend) {
      bonus += Math.floor(Math.random() * 30) + 10;
    }
    if (isNight) {
      bonus += Math.floor(Math.random() * 20) + 5;
    }
    if (Math.random() < 0.15) {
      bonus += Math.floor(Math.random() * 100) + 50;
    }
    if (Math.random() < 0.3) {
      bonus += Math.floor(Math.random() * 15);
    }

    const peakHour = Math.floor(Math.random() * 8) + 10;
    const peakAmount = Math.floor(Math.random() * 20) + 5;
    const hourlySpread = [];
    for (let i = 0; i < 24; i++) {
      const proximity = 1 - Math.min(Math.abs(i - peakHour), 24 - Math.abs(i - peakHour)) / 12;
      const count = proximity > 0 ? Math.floor(Math.random() * (1 + proximity * 3)) + 1 : 0;
      if (count > 0) hourlySpread.push({ hour: i, count });
    }

    const isRageDay = Math.random() < 0.08;
    const rageBonus = isRageDay ? Math.floor(Math.random() * 200) + 100 : 0;

    const total = base + bonus + rageBonus;

    const detail = {
      base,
      weekend: isWeekend ? Math.floor(Math.random() * 30) + 10 : 0,
      night: isNight ? Math.floor(Math.random() * 20) + 5 : 0,
      peakHour,
      hourlySpread,
      rageDay: isRageDay,
      rageBonus,
    };

    autoData = { date: today, amount: total, detail };
    localStorage.setItem(AUTO_KEY, JSON.stringify(autoData));

    return total;
  }

      setTimeout(() => {
        line1.textContent = '';
        line1.className = 'phrase-line';
        divider.className = 'divider-line';

        line2.textContent = resolveText(c);
        line2.className = 'phrase-line calm calm-in';
        divider.className = 'divider-line in';

        textTimer = setTimeout(() => {
          line2.className = 'phrase-line calm calm-out';
          setTimeout(() => {
            line2.className = 'phrase-line';
            line2.textContent = '';
            divider.className = 'divider-line';
            placeholder.style.opacity = '1';
          }, 500);
        }, 2800);
      }, 850);
    }, 1600);
  }

  function playVisuals() {
    spawnEmojis();
  }

  function updateUI(animate) {
    display.textContent = count;
    if (animate) {
      display.classList.remove('pop');
      void display.offsetWidth;
      display.classList.add('pop');
      playVisuals();
      showTextEffect();
    }
  }

  function addCount() {
    if (clickCooldown) return;
    clickCooldown = true;
    setTimeout(() => { clickCooldown = false; }, 400);

    count += 1;
    todayClickCount += 1;
    saveData();
    updateTodayCountDisplay();

    const dir = targetDir;
    placeTarget(dir);
    addBtn.classList.remove('punch-right', 'punch-left', 'punch-up', 'punch-down', 'punch-center');
    void addBtn.offsetLeft;
    addBtn.classList.add('punch-' + dir);
    hitTargetPhoto();

    if (dir === 'center') {
      document.body.classList.remove('screen-shake');
      void document.body.offsetWidth;
      document.body.classList.add('screen-shake');
    }

    setTimeout(() => spawnFaceHit(dir), 80);
    spawnPunchText(dir);

    updateUI(true);
  }

    const labels = [
      '啊！', '疼！', '别打！', '我错了！', '饶命！', '受不了！', '555~',
      '好痛！', '别打了！', '我投降！', '对不起！', '饶了我吧！', '救命啊！',
      '我改还不行吗！', '大哥我错了！', '放我一马！', '疼死我了！', '要死了！',

      '求放过！', '我太难了！', 'WHY ME！', 'No！！！', '救命！',
      '别别别！', '啊——！', '晕了晕了！', '我裂开了！', '心态崩了！',
      '我躲！', '打不着！', '哎哟！', '你玩真的啊！', '下死手啊！',
      '能不能换个地方打！', '脸都打歪了！', '我英俊的脸啊！',
      '你手不疼吗！', '好家伙！', '真有你的！', '我记住你了！',

      '这一拳我记下了！', '打人不打脸！', '不带你这样的！', '你耍赖！',

    const labelCount = 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < labelCount; i++) {
      setTimeout(() => {
        const label = document.createElement('div');
        label.className = 'punch-label';
        label.textContent = labels[Math.floor(Math.random() * labels.length)];
        label.style.left = (cx + 10 + Math.random() * 80 - 20 + ox) + 'px';
        label.style.top = (cy - 90 + Math.random() * 100 + oy) + 'px';
        label.style.fontSize = (18 + Math.random() * 24) + 'px';
        const h = 30 + Math.random() * 30;
        label.style.color = `hsl(${h}, 100%, ${60 + Math.random() * 28}%)`;

    const starCount = dir === 'center' ? 10 + Math.floor(Math.random() * 6) : 5 + Math.floor(Math.random() * 4);
    for (let i = 0; i < starCount; i++) {
      setTimeout(() => {
        const star = document.createElement('div');
        star.className = 'hit-star';
        star.textContent = stars[Math.floor(Math.random() * stars.length)];
        const angle = (i / (dir === 'center' ? 8 : 6)) * Math.PI * 2 + (Math.random() - .5) * .8;
        const mult = dir === 'center' ? 1.6 : 1;
        const dist1 = (30 + Math.random() * 70) * mult;
        const dist2 = (dist1 + 20 + Math.random() * 60) * mult;
        star.style.left = (cx + Math.cos(angle) * 15 + ox) + 'px';

        setTimeout(() => star.remove(), 1300);

  }

    const container = document.getElementById('rain');
    const pool = ['💢', '😤', '💥', '🗯️', '👊', '😭', '💀', '🔥', '😡', '🤬', '💣', '⚡', '🌋', '💔', '😠', '😫', '😩', '🤯', '🥴', '😵', '💫', '🌀', '🌪️', '🎯', '🔪', '🪓', '🧨', '🚫', '❌', '⛔', '💨', '🤺', '👋', '✋', '🙅', '🙄', '😒', '😏', '🖕', '💅', '🤷', '😮‍💨', '😑', '🫠', '🥲', '😤', '🤨', '🧐', '😈', '👿', '💀', '☠️'];

  }

  function spawnPunchText(dir) {

        el.style.fontSize = (18 + Math.random() * 24) + 'px';

  function startIdleEffects() {

    for (let i = 0; i < 5; i++) {

  }

  function startCalmRotation() {
    const topBar = document.getElementById('topBar');
    let idx = 0;
    setInterval(() => {
      if (topBar) {
        topBar.textContent = resolveText(calm[idx % calm.length]);
        idx++;
      }
    }, 3000);

    let ridx = 0;
    setInterval(() => {
      const phrase = calm[ridx % calm.length];
      realtimeInfo.textContent = '✨ ' + resolveText(phrase);
      ridx++;
      setTimeout(() => {
        const r = Math.random();
        let num;
        if (r < .8) num = 1;
        else if (r < .95) num = 2;
        else num = 3;
        realtimeInfo.textContent = '· ' + num + ' 位网友在线 · 每日更新中';
      }, 3500);
    }, 5000);
  }

  let autoTextTimer;

  display.addEventListener('dblclick', function() {
    if (count === 0) return;
    showModal('确定重置计数？', function() {
      count = 0;
      saveData();
      updateUI(false);
    });
  });

  addBtn.addEventListener('click', addCount);

  settingsBtn.addEventListener('click', openSettings);
  closeSettingsBtn.addEventListener('click', applySettings);
  cancelSettingsBtn.addEventListener('click', cancelSettings);
  resetBtn.addEventListener('click', function() {
    showModal('确定重置计数？\n今日拳数也会清空', function() {
      count = 0;
      todayClickCount = 0;
      saveData();
      updateUI(false);
      updateTodayCountDisplay();
    });
  });
  settingsOverlay.addEventListener('click', function(e) {
    if (e.target === settingsOverlay) cancelSettings();
  });
  nameInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); applySettings(); }
  });

  restorePhotoBtn.addEventListener('click', function() {
    try { localStorage.removeItem(PHOTO_KEY); } catch(e) {}
    targetImg.src = generateNamePhoto(customName);
  });

  photoInput.addEventListener('change', function() {
    const file = photoInput.files && photoInput.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) return;

    const reader = new FileReader();
    reader.onload = function() {
      const src = String(reader.result || '');
      if (!src) return;
      targetImg.src = src;
      try {
        localStorage.setItem(PHOTO_KEY, src);
      } catch (e) { /* ignore */ }
      placeTarget(pick(targetDirs));
      hitTargetPhoto();
    };
    reader.readAsDataURL(file);
  });

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if ((e.code === 'Space' || e.key === ' ') && !settingsOverlay.classList.contains('open')) { e.preventDefault(); addCount(); }
    if (e.key === 'Escape' && settingsOverlay.classList.contains('open')) closeSettings();
  });

  init();
})();
</script>
