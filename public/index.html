<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滚 计数器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  background: radial-gradient(ellipse at 50% 20%, #1e1a3a, #0a0a14 70%);
  color: #e0e0e0;
  font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  user-select: none;
  overflow: hidden;
}

canvas#particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

.container {
  text-align: center;
  padding: 40px 36px 32px;
  position: relative;
  z-index: 1;
  background: rgba(255,255,255,.04);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: 36px;
  border: 1px solid rgba(255,255,255,.08);
  box-shadow:
    0 40px 100px rgba(0,0,0,.5),
    0 0 0 1px rgba(255,255,255,.04) inset,
    0 0 100px rgba(180,60,200,.05);
  transform: rotateX(1deg);
  transition: transform .8s cubic-bezier(.23,1,.32,1);
  width: 90vw;
  max-width: 440px;
}
.container:hover { transform: rotateX(0); }

.title-bg {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(200px, 50vw, 500px);
  font-weight: 900;
  color: rgba(255,255,255,.012);
  pointer-events: none;
  letter-spacing: 30px;
  z-index: 0;
  line-height: 1;
}

.top-bar {
  height: 20px;
  margin-bottom: 16px;
  position: relative;
  z-index: 1;
  font-size: 11px;
  color: rgba(255,255,255,.15);
  letter-spacing: 2px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  text-align: center;
}

.count-wrap {
  position: relative;
  z-index: 1;
  margin: 0 auto 8px;
  width: 100%;
  overflow: hidden;
}
.count {
  font-size: clamp(100px, 22vw, 200px);
  font-weight: 900;
  line-height: 1;
  position: relative;
  font-variant-numeric: tabular-nums;
  text-align: center;
  display: block;
  width: 100%;
  background: linear-gradient(180deg, #ffffff 0%, #ffb3c1 45%, #ff6b8a 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 4px 12px rgba(255,65,108,.15));
  transition: transform .15s ease;
}
.count.pop {
  animation: popBounce .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popBounce {
  0% { transform: scale(1); filter: drop-shadow(0 4px 12px rgba(255,65,108,.15)); }
  35% { transform: scale(1.2); filter: drop-shadow(0 8px 30px rgba(255,65,108,.35)); }
  70% { transform: scale(.95); }
  100% { transform: scale(1); filter: drop-shadow(0 4px 12px rgba(255,65,108,.15)); }
}

.label {
  font-size: 12px;
  color: rgba(255,255,255,.3);
  letter-spacing: 12px;
  font-weight: 400;
  margin-bottom: 32px;
  position: relative;
  z-index: 1;
}
.label span {
  display: inline-block;
  animation: labelDrift 5s ease-in-out infinite;
}
.label span:nth-child(2) { animation-delay: .3s; }
.label span:nth-child(3) { animation-delay: .6s; }
.label span:nth-child(4) { animation-delay: .9s; }
.label span:nth-child(5) { animation-delay: 1.2s; }
.label span:nth-child(6) { animation-delay: 1.5s; }
@keyframes labelDrift {
  0%, 100% { transform: translateY(0); opacity: .3; }
  50% { transform: translateY(-3px); opacity: .7; }
}

.btn-wrap {
  position: relative;
  z-index: 1;
  display: inline-block;
}

.btn-main {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  border: none;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 6px;
  cursor: pointer;
  position: relative;
  background: radial-gradient(circle at 36% 28%, #ffcc99, #d4a574 45%, #8b6c4a);
  box-shadow:
    0 0 0 2px rgba(255,255,255,.06),
    0 8px 32px rgba(255,65,108,.35),
    0 0 80px rgba(255,65,108,.1),
    inset 0 -6px 16px rgba(0,0,0,.45),
    inset 0 4px 12px rgba(255,255,255,.2);
  transition: all .3s cubic-bezier(.34,1.56,.64,1);
  color: transparent;
}
.btn-main::before {
  content: '👊';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  pointer-events: none;
  line-height: 130px;
  text-indent: 6px;
  color: rgba(255,255,255,.92);
  text-shadow: 0 2px 8px rgba(0,0,0,.3);
  font-size: 52px;
}
.btn-main::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 20%, rgba(255,220,180,.3), transparent 55%);
  pointer-events: none;
}
.btn-main:hover {
  transform: scale(1.07);
  box-shadow:
    0 0 0 2px rgba(255,255,255,.1),
    0 12px 40px rgba(255,65,108,.45),
    0 0 100px rgba(255,65,108,.15),
    inset 0 -6px 16px rgba(0,0,0,.45),
    inset 0 4px 12px rgba(255,255,255,.25);
}
.btn-main:active {
  transform: scale(.9);
  box-shadow:
    0 0 0 2px rgba(255,255,255,.03),
    0 4px 16px rgba(255,65,108,.2),
    inset 0 -3px 8px rgba(0,0,0,.5),
    inset 0 2px 6px rgba(255,255,255,.1);
}

.glow-ring {
  position: absolute;
  top: 50%; left: 50%;
  width: 160px; height: 160px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1px solid rgba(255,65,108,.07);
  animation: ringPulse 4s ease-in-out infinite;
  pointer-events: none;
}
.glow-ring:nth-child(2) { width: 200px; height: 200px; animation-delay: 1s; }
.glow-ring:nth-child(3) { width: 240px; height: 240px; animation-delay: 2s; }
@keyframes ringPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: .3; }
  50% { transform: translate(-50%, -50%) scale(1.12); opacity: .04; }
}

/* 出拳动画 - 四个方向 */
.btn-main.punch-right {
  animation: punchRight .35s cubic-bezier(.34,1.56,.64,1);
}
.btn-main.punch-left {
  animation: punchLeft .35s cubic-bezier(.34,1.56,.64,1);
}
.btn-main.punch-up {
  animation: punchUp .35s cubic-bezier(.34,1.56,.64,1);
}
.btn-main.punch-down {
  animation: punchDown .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes punchRight {
  0% { transform: translateX(0) scale(1); }
  30% { transform: translateX(60px) scale(1.15) rotate(10deg); }
  55% { transform: translateX(60px) scale(.95) rotate(5deg); }
  80% { transform: translateX(20px) scale(1.05); }
  100% { transform: translateX(0) scale(1); }
}
@keyframes punchLeft {
  0% { transform: translateX(0) scale(1); }
  30% { transform: translateX(-60px) scale(1.15) rotate(-10deg); }
  55% { transform: translateX(-60px) scale(.95) rotate(-5deg); }
  80% { transform: translateX(-20px) scale(1.05); }
  100% { transform: translateX(0) scale(1); }
}
@keyframes punchUp {
  0% { transform: translateY(0) scale(1); }
  30% { transform: translateY(-60px) scale(1.15) rotate(-10deg); }
  55% { transform: translateY(-60px) scale(.95) rotate(-5deg); }
  80% { transform: translateY(-20px) scale(1.05); }
  100% { transform: translateY(0) scale(1); }
}
@keyframes punchDown {
  0% { transform: translateY(0) scale(1); }
  30% { transform: translateY(60px) scale(1.15) rotate(10deg); }
  55% { transform: translateY(60px) scale(.95) rotate(5deg); }
  80% { transform: translateY(20px) scale(1.05); }
  100% { transform: translateY(0) scale(1); }
}

/* 张永建挨揍脸 */
.face-hit {
  position: fixed;
  pointer-events: none;
  z-index: 1000;
  font-size: 80px;
  animation: faceHitAnim 1.2s ease-out forwards;
}
@keyframes faceHitAnim {
  0% { transform: scale(.1) translate(0,0) rotate(0); opacity: 0; }
  15% { transform: scale(1.3) translate(calc(var(--fx)*.15),calc(var(--fy)*.15)) rotate(-5deg); opacity: 1; }
  40% { transform: scale(.9) translate(calc(var(--fx)*.4),calc(var(--fy)*.4)) rotate(5deg); opacity: .9; }
  70% { transform: scale(1.1) translate(calc(var(--fx)*.7),calc(var(--fy)*.7)) rotate(-8deg); opacity: .6; }
  100% { transform: scale(.2) translate(calc(var(--fx)),calc(var(--fy))) rotate(20deg); opacity: 0; }
}

/* 额外飞出的表情 */
.face-fly {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  font-size: 36px;
  animation: faceFlyAnim .9s ease-out forwards;
}
@keyframes faceFlyAnim {
  0% { transform: translate(0,0) scale(.2) rotate(0); opacity: 0; }
  20% { transform: translate(20px,-30px) scale(1.2) rotate(40deg); opacity: 1; }
  100% { transform: translate(80px,-120px) scale(.3) rotate(180deg); opacity: 0; }
}

/* 星星/冲击波 */
.hit-star {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  font-size: 24px;
  animation: hitStarAnim 1.1s ease-out forwards;
}
@keyframes hitStarAnim {
  0% { transform: translate(0,0) scale(0) rotate(0); opacity: 1; }
  50% { transform: translate(var(--dx),var(--dy)) scale(1.3) rotate(180deg); opacity: 1; }
  100% { transform: translate(var(--dx2),var(--dy2)) scale(.2) rotate(360deg); opacity: 0; }
}

/* 拳风文字飞出 - 多种轨迹 */
.punch-word {
  position: fixed;
  pointer-events: none;
  z-index: 1000;
  font-size: clamp(20px, 3.5vw, 30px);
  font-weight: 900;
  white-space: nowrap;
}
.punch-word.straight {
  animation: punchStraight 1.2s ease-out forwards;
}
.punch-word.up {
  animation: punchUp 1.4s ease-out forwards;
}
.punch-word.spin {
  animation: punchSpin 1.3s ease-out forwards;
  animation-delay: .2s;
}
.punch-word.bounce {
  animation: punchBounce 1.5s ease-out forwards;
}
.punch-word.zigzag {
  animation: punchZigzag 1.4s ease-out forwards;
}
.punch-word.shatter {
  animation: punchShatter 1.2s ease-out forwards;
}
.punch-word.swoop {
  animation: punchSwoop 1.3s ease-out forwards;
}
.punch-word.wobble {
  animation: punchWobble 1.4s ease-out forwards;
}
.punch-word.spiral {
  animation: punchSpiral 1.5s ease-out forwards;
  animation-delay: .2s;
}
@keyframes punchStraight {
  0% { transform: translate(0,0) scale(.2) rotate(0); opacity: 0; }
  20% { transform: translate(var(--wx),var(--wy)) scale(1.1) rotate(5deg); opacity: 1; }
  100% { transform: translate(var(--wx2),var(--wy2)) scale(.3) rotate(30deg); opacity: 0; }
}
@keyframes punchUp {
  0% { transform: translate(0,0) scale(.3); opacity: 0; }
  20% { transform: translate(-10px,-30px) scale(1.2); opacity: 1; }
  60% { transform: translate(10px,-90px) scale(1); opacity: .8; }
  100% { transform: translate(-5px,-130px) scale(.2); opacity: 0; }
}
@keyframes punchSpin {
  0% { transform: translate(0,0) scale(.2) rotate(0); opacity: 0; }
  30% { transform: translate(var(--wx),var(--wy)) scale(1.3) rotate(180deg); opacity: 1; }
  100% { transform: translate(var(--wx2),var(--wy2)) scale(.2) rotate(720deg); opacity: 0; }
}
@keyframes punchBounce {
  0% { transform: translate(0,0) scale(.2) rotate(-20deg); opacity: 0; }
  25% { transform: translate(10px,-40px) scale(1.2) rotate(10deg); opacity: 1; }
  50% { transform: translate(-15px,-20px) scale(1) rotate(-5deg); opacity: .9; }
  75% { transform: translate(20px,-50px) scale(.8) rotate(15deg); opacity: .6; }
  100% { transform: translate(-10px,-80px) scale(.2) rotate(30deg); opacity: 0; }
}
@keyframes punchZigzag {
  0% { transform: translate(0,0) scale(.1); opacity: 0; }
  20% { transform: translate(var(--wx),var(--wy)) scale(1.2) rotate(10deg); opacity: 1; }
  45% { transform: translate(calc(var(--wx2)*.5),calc(var(--wy)*1.3)) scale(1) rotate(-15deg); opacity: .9; }
  70% { transform: translate(var(--wx2),calc(var(--wy)*.6)) scale(.8) rotate(20deg); opacity: .5; }
  100% { transform: translate(calc(var(--wx2)*1.3),var(--wy2)) scale(.2) rotate(-30deg); opacity: 0; }
}
@keyframes punchShatter {
  0% { transform: translate(0,0) scale(1) rotate(0); opacity: 0; }
  10% { transform: translate(0,0) scale(1.3) rotate(0); opacity: 1; }
  30% { transform: translate(var(--wx),var(--wy)) scale(1.1) rotate(15deg); opacity: .9; }
  60% { transform: translate(calc(var(--wx)*1.5),calc(var(--wy)*1.5)) scale(.6) rotate(45deg); opacity: .5; }
  100% { transform: translate(var(--wx2),var(--wy2)) scale(.1) rotate(90deg); opacity: 0; }
}
@keyframes punchSwoop {
  0% { transform: translate(0,0) scale(.2); opacity: 0; }
  30% { transform: translate(40px,-50px) scale(1.3) rotate(-15deg); opacity: 1; }
  60% { transform: translate(-20px,-20px) scale(1) rotate(5deg); opacity: .8; }
  100% { transform: translate(var(--wx2),var(--wy2)) scale(.2) rotate(20deg); opacity: 0; }
}
@keyframes punchWobble {
  0% { transform: translate(0,0) scale(.2); opacity: 0; }
  25% { transform: translate(var(--wx),var(--wy)) scale(1.2) rotate(-25deg); opacity: 1; }
  50% { transform: translate(calc(var(--wx)*1.2),calc(var(--wy)*.6)) scale(1) rotate(20deg); opacity: .9; }
  75% { transform: translate(calc(var(--wx)*.5),calc(var(--wy)*1.4)) scale(.7) rotate(-15deg); opacity: .5; }
  100% { transform: translate(var(--wx2),var(--wy2)) scale(.2) rotate(10deg); opacity: 0; }
}
@keyframes punchSpiral {
  0% { transform: translate(0,0) scale(.1) rotate(0); opacity: 0; }
  25% { transform: translate(30px,-40px) scale(1.1) rotate(180deg); opacity: 1; }
  50% { transform: translate(-20px,-80px) scale(.9) rotate(360deg); opacity: .8; }
  75% { transform: translate(20px,-110px) scale(.6) rotate(540deg); opacity: .4; }
  100% { transform: translate(0,-140px) scale(.2) rotate(720deg); opacity: 0; }
}

/* 揍人题字 */
.punch-label {
  position: fixed;
  pointer-events: none;
  z-index: 1000;
  font-size: clamp(20px, 4vw, 36px);
  font-weight: 900;
  white-space: nowrap;
  letter-spacing: 4px;
  animation: punchLabelAnim 1.1s ease-out forwards;
}
@keyframes punchLabelAnim {
  0% { transform: translateY(0) scale(.5) rotate(-10deg); opacity: 0; }
  30% { transform: translateY(-20px) scale(1.1) rotate(3deg); opacity: 1; }
  100% { transform: translateY(-60px) scale(.8) rotate(5deg); opacity: 0; }
}

.btn-shadow {
  width: 100px; height: 14px;
  margin: -4px auto 0;
  background: radial-gradient(ellipse, rgba(255,65,108,.25), transparent 70%);
  border-radius: 50%;
  filter: blur(8px);
  position: relative;
  z-index: 0;
  transition: all .3s ease;
}
.btn-main:hover + .btn-shadow { transform: scale(1.2); opacity: .6; }
.btn-main:active + .btn-shadow { transform: scale(.7); opacity: .3; }

.daily-remain {
  font-size: 11px;
  color: rgba(255,255,255,.18);
  letter-spacing: 3px;
  margin-top: 18px;
  position: relative;
  z-index: 1;
  min-height: 18px;
  transition: all .3s ease;
}

.text-card {
  margin-top: 22px;
  min-height: 110px;
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.text-card-inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 8px;
}

.placeholder-line {
  font-size: 13px;
  color: rgba(255,255,255,.08);
  letter-spacing: 4px;
  font-weight: 300;
  opacity: 1;
  transition: opacity .4s ease;
}

.phrase-line {
  opacity: 0;
  will-change: transform, opacity;
  width: 100%;
  text-align: center;
  word-break: break-word;
  padding: 0 8px;
}

.phrase-line.angry {
  font-size: clamp(18px, 3vw, 26px);
  font-weight: 800;
  letter-spacing: 2px;
  color: #ff4757;
  text-shadow: 0 0 30px rgba(255,71,87,.35), 0 4px 20px rgba(255,71,87,.15);
}

.phrase-line.calm {
  font-size: clamp(15px, 2.6vw, 20px);
  font-weight: 500;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #7bed9f, #70a1ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.phrase-line.angry-in {
  animation: angryIn .4s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes angryIn {
  0% { opacity: 0; transform: scale(.3) translateY(20px); filter: blur(8px); }
  60% { opacity: 1; transform: scale(1.05) translateY(-2px); filter: blur(0); }
  100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
}

.phrase-line.angry-out {
  animation: angryOut .3s ease-in forwards;
}
@keyframes angryOut {
  0% { opacity: 1; transform: scale(1) translateY(0); }
  100% { opacity: 0; transform: scale(1.15) translateY(-16px); }
}

.phrase-line.calm-in {
  animation: calmIn .5s cubic-bezier(.23,1,.32,1) forwards;
}
@keyframes calmIn {
  0% { opacity: 0; transform: translateY(12px); }
  100% { opacity: 1; transform: translateY(0); }
}

.phrase-line.calm-out {
  animation: calmOut .35s ease-in forwards;
}
@keyframes calmOut {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-10px); }
}

.divider-line {
  width: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent);
  margin: 4px 0;
  transition: none;
}
.divider-line.in { animation: dividerGrow .45s ease forwards; }
@keyframes dividerGrow {
  0% { width: 0; opacity: 0; }
  100% { width: 100px; opacity: 1; }
}
.divider-line.out { animation: dividerShrink .35s ease forwards; }
@keyframes dividerShrink {
  0% { width: 100px; opacity: 1; }
  100% { width: 0; opacity: 0; }
}

.status {
  margin-top: 20px;
  font-size: 10px;
  color: rgba(255,255,255,.1);
  letter-spacing: 3px;
  position: relative;
  z-index: 1;
}
.status.online { color: rgba(100,255,100,.25); }
.status.offline { color: rgba(255,100,100,.2); }

.emoji-rain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
}
.emoji {
  position: absolute;
  font-size: 28px;
  animation: emojiFall linear forwards;
  will-change: transform, opacity;
}
@keyframes nameDrop {
  0% { transform: translateY(0) rotate(-12deg) scale(.2); opacity: 0; filter: blur(6px); }
  15% { opacity: 1; transform: translateY(15vh) rotate(3deg) scale(1.1); filter: blur(0); }
  80% { opacity: 1; transform: translateY(80vh) rotate(15deg) scale(.8); filter: blur(0); }
  100% { transform: translateY(110vh) rotate(25deg) scale(.3); opacity: 0; filter: blur(4px); }
}

@keyframes emojiFall {
  0% { transform: translateY(-60px) rotate(0deg) scale(.4); opacity: 0; }
  8% { opacity: 1; transform: translateY(0) rotate(25deg) scale(1); }
  100% { transform: translateY(100vh) rotate(1080deg) scale(.2); opacity: 0; }
}

.realtime-info {
  font-size: 10px;
  color: rgba(255,255,255,.1);
  letter-spacing: 2px;
  margin-bottom: 4px;
  position: relative;
  z-index: 1;
}
.realtime-info em {
  font-style: normal;
  color: rgba(100,255,150,.25);
}

@media (max-width: 520px) {
  .container { padding: 24px 20px 20px; border-radius: 28px; width: 94vw; max-width: 94vw; }
  .btn-main { width: 100px; height: 100px; }
  .btn-main::before { line-height: 100px; font-size: 42px; }
  .label { font-size: 10px; letter-spacing: 8px; margin-bottom: 20px; }
  .top-bar { font-size: 9px; height: 16px; margin-bottom: 12px; }
  .daily-remain { font-size: 9px; margin-top: 14px; }
  .text-card { min-height: 90px; }
  .phrase-line.angry { font-size: clamp(16px, 4vw, 20px); }
  .phrase-line.calm { font-size: clamp(13px, 3.5vw, 16px); }
  .realtime-info { font-size: 8px; }
  .face-hit { font-size: 50px !important; }
  .punch-label { font-size: clamp(16px, 4vw, 24px) !important; }
  .glow-ring { display: none; }
  .btn-shadow { width: 70px; }
  .count-wrap { margin: 0 auto 4px; }
}

@media (max-width: 380px) {
  .container { padding: 16px 14px 16px; border-radius: 20px; width: 96vw; max-width: 96vw; }
  .btn-main { width: 80px; height: 80px; }
  .btn-main::before { line-height: 80px; font-size: 36px; }
  .label { letter-spacing: 4px; font-size: 9px; }
  .text-card { min-height: 76px; }
  .count { font-size: clamp(56px, 16vw, 80px); }
}
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div class="emoji-rain" id="rain"></div>

<div class="container">

  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.size = Math.random() * 2 + .3;
      this.speedX = (Math.random() - .5) * .25;
      this.speedY = (Math.random() - .5) * .25;
      this.opacity = Math.random() * .4 + .06;
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
      if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
      ctx.fill();
    }
  }
  for (let i = 0; i < 60; i++) particles.push(new Particle());

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) { p.update(); p.draw(); }
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 100) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(180,80,200,${.04 * (1 - dist / 100)})`;
          ctx.lineWidth = .4;
          ctx.stroke();
        }
      }
    }
    raf = requestAnimationFrame(animateParticles);
  }
  animateParticles();

  // ---- localStorage 读写 ----
  const STORAGE_KEY = 'gun_counter_data';

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (typeof d.count === 'number' && typeof d.date === 'string') return d;
      }
    } catch (e) { /* ignore */ }
    return { count: 0, date: '' };
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ count, date: todayStr() }));
  }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  // ---- 每日随机自增（伪造实时更新） ----
  const AUTO_KEY = 'gun_auto_increment';

  function applyDailyAutoIncrement() {
    const today = todayStr();
    let autoData;
    try {
      autoData = JSON.parse(localStorage.getItem(AUTO_KEY));
    } catch (e) { autoData = null; }

    if (autoData && autoData.date === today) {
      return 0;
    }

    const day = new Date().getDay();
    const isWeekend = day === 0 || day === 6;
    const hour = new Date().getHours();
    const isNight = hour < 6 || hour > 22;

    let base = Math.floor(Math.random() * 25) + 8;
    let bonus = 0;

    if (isWeekend) {
      bonus += Math.floor(Math.random() * 30) + 10;
    }
    if (isNight) {
      bonus += Math.floor(Math.random() * 20) + 5;
    }
    if (Math.random() < 0.15) {
      bonus += Math.floor(Math.random() * 100) + 50;
    }
    if (Math.random() < 0.3) {
      bonus += Math.floor(Math.random() * 15);
    }

    const peakHour = Math.floor(Math.random() * 8) + 10;
    const peakAmount = Math.floor(Math.random() * 20) + 5;
    const hourlySpread = [];
    for (let i = 0; i < 24; i++) {
      const proximity = 1 - Math.min(Math.abs(i - peakHour), 24 - Math.abs(i - peakHour)) / 12;
      const count = proximity > 0 ? Math.floor(Math.random() * (1 + proximity * 3)) + 1 : 0;
      if (count > 0) hourlySpread.push({ hour: i, count });
    }

    const isRageDay = Math.random() < 0.08;
    const rageBonus = isRageDay ? Math.floor(Math.random() * 200) + 100 : 0;

    const total = base + bonus + rageBonus;

    const detail = {
      base,
      weekend: isWeekend ? Math.floor(Math.random() * 30) + 10 : 0,
      night: isNight ? Math.floor(Math.random() * 20) + 5 : 0,
      peakHour,
      hourlySpread,
      rageDay: isRageDay,
      rageBonus,
    };

    autoData = { date: today, amount: total, detail };
    localStorage.setItem(AUTO_KEY, JSON.stringify(autoData));

    return total;
  }

    const stars = ['💫', '✨', '⭐', '🌟', '💥', '✨', '⭐', '💢', '💨', '💫'];
    for (let i = 0; i < 5 + Math.floor(Math.random() * 4); i++) {

        const star = document.createElement('div');
        star.className = 'hit-star';
        star.textContent = stars[Math.floor(Math.random() * stars.length)];
        const angle = (i / 6) * Math.PI * 2 + (Math.random() - .5) * .8;
        const dist1 = 30 + Math.random() * 70;
        const dist2 = dist1 + 20 + Math.random() * 60;
        star.style.left = (cx + Math.cos(angle) * 15 + ox) + 'px';
        star.style.top = (cy + Math.sin(angle) * 15 - 20 + oy) + 'px';

        star.style.setProperty('--dy', Math.sin(angle) * dist1 + 'px');

  function startCalmRotation() {
    const topBar = document.getElementById('topBar');
    let idx = 0;
    setInterval(() => {
      if (topBar) {
        topBar.textContent = calm[idx % calm.length];
        idx++;
      }
    }, 3000);

    let ridx = 0;
    setInterval(() => {
      const phrase = calm[ridx % calm.length];
      realtimeInfo.textContent = '✨ ' + phrase;
      ridx++;
      setTimeout(() => {
        const r = Math.random();
        let num;
        if (r < 0.6) num = 1;
        else if (r < 0.85) num = 2;
        else num = 3;
        realtimeInfo.textContent = '· ' + num + ' 位网友在线 · 每日更新中';
      }, 3500);
    }, 5000);
  }

  let autoTextTimer;

  display.addEventListener('dblclick', function() {
    if (count === 0) return;
    if (confirm('确定重置计数？')) {
      count = 0;
      saveData();
      updateUI(false);
    }
  });

  addBtn.addEventListener('click', addCount);

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); addCount(); }
  });

  init();
})();
