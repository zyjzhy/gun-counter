<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  background: radial-gradient(ellipse at 50% 20%, #1e1a3a, #0a0a14 70%);
  color: #e0e0e0;
  font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  user-select: none;
  overflow: hidden;
}

canvas#particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

.container {
  text-align: center;
  padding: 48px 64px 36px;
  position: relative;
  z-index: 1;
  background: rgba(255,255,255,.04);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: 48px;
  border: 1px solid rgba(255,255,255,.08);
  box-shadow:
    0 40px 100px rgba(0,0,0,.5),
    0 0 0 1px rgba(255,255,255,.04) inset,
    0 0 100px rgba(180,60,200,.05);
  transform: rotateX(1deg);
  transition: transform .8s cubic-bezier(.23,1,.32,1);
  max-width: 92vw;
}
.container:hover { transform: rotateX(0); }

.title-bg {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(200px, 50vw, 500px);
  font-weight: 900;
  color: rgba(255,255,255,.012);
  pointer-events: none;
  letter-spacing: 30px;
  z-index: 0;
  line-height: 1;
}

.top-bar {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 16px;
  position: relative;
  z-index: 1;
}
.top-bar span {
  width: 8px; height: 8px;
  border-radius: 50%;
  opacity: .3;
}
.top-bar span:nth-child(1) { background: #ff6b8a; }
.top-bar span:nth-child(2) { background: #ffb347; }
.top-bar span:nth-child(3) { background: #7bed9f; }

.count-wrap {
  position: relative;
  z-index: 1;
  margin: 0 0 8px;
}
.count {
  font-size: clamp(100px, 22vw, 200px);
  font-weight: 900;
  line-height: 1;
  display: inline-block;
  position: relative;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #ffffff 0%, #ffb3c1 45%, #ff6b8a 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 4px 12px rgba(255,65,108,.15));
  transition: transform .15s ease;
}
.count.pop {
  animation: popBounce .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popBounce {
  0% { transform: scale(1); filter: drop-shadow(0 4px 12px rgba(255,65,108,.15)); }
  35% { transform: scale(1.2); filter: drop-shadow(0 8px 30px rgba(255,65,108,.35)); }
  70% { transform: scale(.95); }
  100% { transform: scale(1); filter: drop-shadow(0 4px 12px rgba(255,65,108,.15)); }
}

.label {
  font-size: 12px;
  color: rgba(255,255,255,.3);
  letter-spacing: 12px;
  font-weight: 400;
  margin-bottom: 32px;
  position: relative;
  z-index: 1;
}
.label span {
  display: inline-block;
  animation: labelDrift 5s ease-in-out infinite;
}
.label span:nth-child(2) { animation-delay: .3s; }
.label span:nth-child(3) { animation-delay: .6s; }
.label span:nth-child(4) { animation-delay: .9s; }
.label span:nth-child(5) { animation-delay: 1.2s; }
.label span:nth-child(6) { animation-delay: 1.5s; }
@keyframes labelDrift {
  0%, 100% { transform: translateY(0); opacity: .3; }
  50% { transform: translateY(-3px); opacity: .7; }
}

.btn-wrap {
  position: relative;
  z-index: 1;
  display: inline-block;
}

.btn-main {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  border: none;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 6px;
  cursor: pointer;
  position: relative;
  background: radial-gradient(circle at 36% 28%, #ff7a9a, #c4123a 65%, #6e0a20);
  box-shadow:
    0 0 0 2px rgba(255,255,255,.06),
    0 8px 32px rgba(255,65,108,.35),
    0 0 80px rgba(255,65,108,.1),
    inset 0 -6px 16px rgba(0,0,0,.45),
    inset 0 4px 12px rgba(255,255,255,.2);
  transition: all .3s cubic-bezier(.34,1.56,.64,1);
  color: transparent;
}
.btn-main::before {
  content: '滚';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  pointer-events: none;
  line-height: 130px;
  text-indent: 6px;
  color: rgba(255,255,255,.92);
  text-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.btn-main::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.25), transparent 50%);
  pointer-events: none;
}
.btn-main:hover {
  transform: scale(1.07);
  box-shadow:
    0 0 0 2px rgba(255,255,255,.1),
    0 12px 40px rgba(255,65,108,.45),
    0 0 100px rgba(255,65,108,.15),
    inset 0 -6px 16px rgba(0,0,0,.45),
    inset 0 4px 12px rgba(255,255,255,.25);
}
.btn-main:active {
  transform: scale(.9);
  box-shadow:
    0 0 0 2px rgba(255,255,255,.03),
    0 4px 16px rgba(255,65,108,.2),
    inset 0 -3px 8px rgba(0,0,0,.5),
    inset 0 2px 6px rgba(255,255,255,.1);
}

.glow-ring {
  position: absolute;
  top: 50%; left: 50%;
  width: 160px; height: 160px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1px solid rgba(255,65,108,.07);
  animation: ringPulse 4s ease-in-out infinite;
  pointer-events: none;
}
.glow-ring:nth-child(2) { width: 200px; height: 200px; animation-delay: 1s; }
.glow-ring:nth-child(3) { width: 240px; height: 240px; animation-delay: 2s; }
@keyframes ringPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: .3; }
  50% { transform: translate(-50%, -50%) scale(1.12); opacity: .04; }
}

.btn-shadow {
  width: 100px; height: 14px;
  margin: -4px auto 0;
  background: radial-gradient(ellipse, rgba(255,65,108,.25), transparent 70%);
  border-radius: 50%;
  filter: blur(8px);
  position: relative;
  z-index: 0;
  transition: all .3s ease;
}
.btn-main:hover + .btn-shadow { transform: scale(1.2); opacity: .6; }
.btn-main:active + .btn-shadow { transform: scale(.7); opacity: .3; }

.daily-remain {
  font-size: 11px;
  color: rgba(255,255,255,.18);
  letter-spacing: 3px;
  margin-top: 18px;
  position: relative;
  z-index: 1;
  min-height: 18px;
  transition: all .3s ease;
}

.text-card {
  margin-top: 22px;
  height: 82px;
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.text-card-inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
}

.placeholder-line {
  font-size: 13px;
  color: rgba(255,255,255,.08);
  letter-spacing: 4px;
  font-weight: 300;
  opacity: 1;
  transition: opacity .4s ease;
}

.phrase-line {
  opacity: 0;
  will-change: transform, opacity;
}

.phrase-line.angry {
  font-size: clamp(18px, 3vw, 26px);
  font-weight: 800;
  letter-spacing: 2px;
  color: #ff4757;
  text-shadow: 0 0 30px rgba(255,71,87,.35), 0 4px 20px rgba(255,71,87,.15);
}

.phrase-line.calm {
  font-size: clamp(16px, 2.4vw, 20px);
  font-weight: 500;
  letter-spacing: 3px;
  background: linear-gradient(135deg, #7bed9f, #70a1ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.phrase-line.angry-in {
  animation: angryIn .55s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes angryIn {
  0% { opacity: 0; transform: scale(.2) translateY(30px) rotate(-8deg) translateX(-20px); filter: blur(12px); }
  45% { opacity: 1; transform: scale(1.12) translateY(-4px) rotate(1deg) translateX(2px); filter: blur(0); }
  100% { opacity: 1; transform: scale(1) translateY(0) rotate(0) translateX(0); filter: blur(0); }
}

.phrase-line.angry-out {
  animation: angryOut .4s cubic-bezier(.6,-.28,.74,.05) forwards;
}
@keyframes angryOut {
  0% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
  100% { opacity: 0; transform: scale(1.4) translateY(-24px) rotate(4deg); filter: blur(8px); }
}

.phrase-line.calm-in {
  animation: calmIn .8s cubic-bezier(.23,1,.32,1) forwards;
}
@keyframes calmIn {
  0% { opacity: 0; transform: translateY(16px) scale(.92); filter: blur(6px); }
  60% { opacity: 1; transform: translateY(-2px) scale(1.01); filter: blur(0); }
  100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

.phrase-line.calm-out {
  animation: calmOut .6s ease-in forwards;
}
@keyframes calmOut {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-12px) scale(.88); }
}

.divider-line {
  width: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent);
  margin: 4px 0;
  transition: none;
}
.divider-line.in { animation: dividerGrow .45s ease forwards; }
@keyframes dividerGrow {
  0% { width: 0; opacity: 0; }
  100% { width: 100px; opacity: 1; }
}
.divider-line.out { animation: dividerShrink .35s ease forwards; }
@keyframes dividerShrink {
  0% { width: 100px; opacity: 1; }
  100% { width: 0; opacity: 0; }
}

.status {
  margin-top: 20px;
  font-size: 10px;
  color: rgba(255,255,255,.1);
  letter-spacing: 3px;
  position: relative;
  z-index: 1;
}
.status.online { color: rgba(100,255,100,.25); }
.status.offline { color: rgba(255,100,100,.2); }

.emoji-rain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
}
.emoji {
  position: absolute;
  font-size: 28px;
  animation: emojiFall linear forwards;
  will-change: transform, opacity;
}
@keyframes nameDrop {
  0% { transform: translateY(0) rotate(-12deg) scale(.2); opacity: 0; filter: blur(6px); }
  15% { opacity: 1; transform: translateY(15vh) rotate(3deg) scale(1.1); filter: blur(0); }
  80% { opacity: 1; transform: translateY(80vh) rotate(15deg) scale(.8); filter: blur(0); }
  100% { transform: translateY(110vh) rotate(25deg) scale(.3); opacity: 0; filter: blur(4px); }
}

@keyframes emojiFall {
  0% { transform: translateY(-60px) rotate(0deg) scale(.4); opacity: 0; }
  8% { opacity: 1; transform: translateY(0) rotate(25deg) scale(1); }
  100% { transform: translateY(100vh) rotate(1080deg) scale(.2); opacity: 0; }
}

.realtime-info {
  font-size: 10px;
  color: rgba(255,255,255,.1);
  letter-spacing: 2px;
  margin-bottom: 4px;
  position: relative;
  z-index: 1;
}
.realtime-info em {
  font-style: normal;
  color: rgba(100,255,150,.25);
}

@media (max-width: 520px) {
  .container { padding: 32px 28px 28px; border-radius: 32px; }
  .btn-main { width: 110px; height: 110px; }
  .btn-main::before { line-height: 110px; }
  .daily-remain { font-size: 10px; }
}
</style>
</head>

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.size = Math.random() * 2 + .3;
      this.speedX = (Math.random() - .5) * .25;
      this.speedY = (Math.random() - .5) * .25;
      this.opacity = Math.random() * .4 + .06;
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
      if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
      ctx.fill();
    }
  }
  for (let i = 0; i < 60; i++) particles.push(new Particle());

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) { p.update(); p.draw(); }
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 100) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(180,80,200,${.04 * (1 - dist / 100)})`;
          ctx.lineWidth = .4;
          ctx.stroke();
        }
      }
    }
    raf = requestAnimationFrame(animateParticles);
  }
  animateParticles();

  // ---- localStorage 读写 ----
  const STORAGE_KEY = 'gun_counter_data';

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (typeof d.count === 'number' && typeof d.date === 'string') return d;
      }
    } catch (e) { /* ignore */ }
    return { count: 0, date: '' };
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ count, date: todayStr() }));
  }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  // ---- 每日随机自增（伪造实时更新） ----
  const AUTO_KEY = 'gun_auto_increment';

  function applyDailyAutoIncrement() {
    const today = todayStr();
    let autoData;
    try {
      autoData = JSON.parse(localStorage.getItem(AUTO_KEY));
    } catch (e) { autoData = null; }

    if (autoData && autoData.date === today) {
      return 0;
    }

    const increment = Math.floor(Math.random() * 15) + 3;
    autoData = { date: today, amount: increment };
    localStorage.setItem(AUTO_KEY, JSON.stringify(autoData));

    return increment;
  }

  function updateStatus() {
    const dots = ['.', '..', '...'];
    let idx = 0;
    setInterval(() => {
      if (fakeOnline) {
        statusEl.className = 'status online';
        statusEl.textContent = '· ' + new Date().toLocaleString('zh-CN', { hour12: false }) + ' 实时同步' + dots[idx % 3];
        idx++;
      }
    }, 1200);
  }

  function init() {
    const saved = loadData();
    count = saved.count;
    const today = todayStr();

    if (saved.date !== today) {
      saved.date = today;
      saved.count = 0;
      count = 0;
      saveData();
    }

    const autoInc = applyDailyAutoIncrement();
    if (autoInc > 0) {
      count += autoInc;
      saveData();
      updateUI(false);
      showAutoNotify(autoInc);
    } else {
      updateUI(false);
    }

    fakeOnline = true;
    updateStatus();
    updateRealtimeInfo();
  }
